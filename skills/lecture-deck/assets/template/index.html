<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>{{LECTURE_TITLE}}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/plugin/highlight/monokai.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">

        <!-- 1. 타이틀 (title-slide 레이아웃) -->
        <section class="title-slide" data-background-gradient="linear-gradient(160deg, #0A0A0A 0%, #05140b 100%)">
          <div class="title-block">
            <p class="eyebrow">{{EYEBROW}}</p>
            <h1>{{TITLE}}</h1>
            <p class="subtitle">{{SUBTITLE}}</p>
          </div>
          <p class="footer-meta">{{FOOTER_META}}</p>
          <aside class="notes">{{SPEAKER_NOTE}}</aside>
        </section>

        <!--
          본문 슬라이드는 layouts.md의 8가지 레이아웃 패턴에서 골라 여기에 추가한다.
          각 <section>에는 <aside class="notes">로 발표자 노트를 함께 넣는다.
        -->

        <!-- 마지막. 마무리 (closing 레이아웃) -->
        <section>
          <h2>{{CLOSING_TITLE}}</h2>
          <ul class="bullets big">
            <li>{{NEXT_ACTION_1}}</li>
            <li>{{NEXT_ACTION_2}}</li>
          </ul>
          <aside class="notes">{{CLOSING_NOTE}}</aside>
        </section>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/plugin/notes/notes.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      Reveal.initialize({
        width: 1280,
        height: 720,
        margin: 0,
        minScale: 0.2,
        maxScale: 2.0,
        hash: true,
        slideNumber: "c/t",
        transition: "fade",
        backgroundTransition: "fade",
        controls: true,
        progress: true,
        center: true,
        plugins: [RevealHighlight, RevealNotes],
      });
      // lucide 아이콘: <i data-lucide="zap"></i> 형태로 본문에 삽입하면 렌더된다.
      if (window.lucide) {
        lucide.createIcons();
        Reveal.on("slidechanged", () => lucide.createIcons());
      }
    </script>
  </body>
</html>
