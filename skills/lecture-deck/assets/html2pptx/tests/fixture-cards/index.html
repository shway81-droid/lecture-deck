<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>html2pptx hero-card & guardrail-card fixture</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">

        <!-- 1. Standalone hero-card -->
        <section>
          <h2>핵심 메시지</h2>
          <div class="hero-card">
            <p class="big">두 시간 뒤에는<br /><strong>결과물이 손에 남습니다</strong></p>
          </div>
          <aside class="notes">히어로 카드 테스트.</aside>
        </section>

        <!-- 2. Guardrail card -->
        <section>
          <h2>주의사항</h2>
          <div class="guardrail-card">
            <p class="guardrail-title">개인정보 입력 금지</p>
            <p class="guardrail-body">민감한 정보는 절대 프롬프트에 넣지 마세요. AI 서비스는 입력 내용을 학습에 사용할 수 있습니다.</p>
          </div>
          <aside class="notes">가드레일 카드 테스트.</aside>
        </section>

        <!-- 3. Both cards on one slide -->
        <section>
          <h2>함께 배치</h2>
          <div class="hero-card">
            <p class="big">핵심은 <strong>명확한 지시</strong>입니다</p>
          </div>
          <div class="guardrail-card">
            <p class="guardrail-title">기억하세요</p>
            <p class="guardrail-body">항상 결과를 검토하고 확인하세요.</p>
          </div>
          <aside class="notes">두 카드 함께 테스트.</aside>
        </section>

      </div>
    </div>
  </body>
</html>
